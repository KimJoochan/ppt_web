<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>테마 클러스터 맵</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- 데이터 : data.js(기본값) → save.js(배포본, 없어도 됨) → store.js(저장소) 순서로 읽습니다 -->
<script src="data.js"></script>
<script src="save.js" onerror="console.info('save.js 없음 — 기본값/저장본을 사용합니다')"></script>
<script src="store.js"></script>
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
         word-break: keep-all; }
  #world { transform-origin: 0 0; }
  #world.animate { transition: transform .7s cubic-bezier(.22,.61,.36,1); }
  .marker { position: absolute; transform-origin: center center; }
  .fade { transition: opacity .4s ease, filter .4s ease, visibility .4s; }
  .hidden-soft { opacity: 0; visibility: hidden; pointer-events: none; }
  .dim { opacity: .3; filter: saturate(.4); pointer-events: none; }
  /* 지도 격자 (화면 공유 시 노이즈가 되지 않도록 아주 옅게) */
  .grid-bg {
    background-image:
      linear-gradient(rgba(100,116,139,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,116,139,.07) 1px, transparent 1px);
    background-size: 96px 96px;
  }
  .modal-in { animation: modalIn .3s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes modalIn { from { opacity:0; transform: translateY(20px) scale(.97);} to { opacity:1; transform:none; } }
  .no-select { user-select: none; -webkit-user-select: none; }
  kbd { font-family: inherit; }
  /* 공지사항 버튼 : 등장 + 주의를 끄는 파장 */
  .notice-pop { animation: noticePop .55s cubic-bezier(.22,1.2,.36,1) both,
                           noticePulse 2.6s ease-in-out .6s infinite; }
  @keyframes noticePop {
    from { opacity: 0; transform: translateY(24px) scale(.9); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes noticePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(15,23,42,.30); }
    50%      { box-shadow: 0 0 0 18px rgba(15,23,42,0); }
  }
</style>
</head>
<body class="bg-white text-slate-900 no-select">

<!-- ===================== 지도 스테이지 ===================== -->
<div id="stage" class="relative w-screen h-screen overflow-hidden bg-slate-50 grid-bg cursor-grab">

  <!-- 은은한 컬러 번짐 -->
  <div class="pointer-events-none absolute inset-0 z-0">
    <div class="absolute -top-40 -left-32 h-[32rem] w-[32rem] rounded-full bg-sky-200/45 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-32 h-[32rem] w-[32rem] rounded-full bg-emerald-200/40 blur-3xl"></div>
    <div class="absolute left-1/2 top-1/2 h-[26rem] w-[26rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-amber-100/50 blur-3xl"></div>
  </div>

  <!-- 좌표계(월드) : JS가 마커를 그려 넣습니다 -->
  <div id="world" class="absolute left-0 top-0 z-10"></div>

  <!-- ===================== 상단 UI ===================== -->
  <header class="pointer-events-none absolute inset-x-0 top-0 z-30">
    <div class="flex items-start justify-between gap-6 p-6 sm:p-8">
      <div class="pointer-events-auto hidden">
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">여행 · 음악 · 요리 · 산책</h1>
        <p id="breadcrumb" class="mt-2 text-base font-medium text-slate-500 sm:text-lg">이미지를 클릭하면 확대되면서 키워드가 나타납니다</p>
      </div>

      <div class="pointer-events-auto flex items-center gap-2">
        <button id="btnBack"
          class="hidden items-center gap-2 rounded-full border-2 border-slate-200 bg-white px-5 py-2.5 text-base font-bold text-slate-700 shadow-sm transition hover:border-slate-300 hover:shadow active:scale-95">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          전체 보기
        </button>
      </div>
    </div>
  </header>

  <!-- ===================== 하단 슬라이드 내비게이션 ===================== -->
  <div class="absolute inset-x-0 bottom-0 z-30 flex justify-center p-6 hidden">
    <div id="slideNav"
      class="flex items-center gap-1.5 rounded-full border-2 border-slate-200 bg-white/90 p-1.5 shadow-lg backdrop-blur"></div>
  </div>

  <!-- ===================== 전체화면 · 줌 컨트롤 ===================== -->
  <div class="absolute bottom-6 right-6 z-30 flex flex-col items-end gap-3" style="z-index: 999;">

    <!-- 전체화면 전용 버튼 -->
    <button id="btnFull" title="전체화면 (F)"
      class="flex items-center gap-2.5 rounded-full border-2 border-slate-900 bg-slate-900 px-6 py-3 text-base font-extrabold text-white shadow-xl transition hover:bg-slate-700 active:scale-95">
      <svg id="btnFullIcon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span id="btnFullText">전체화면</span>
    </button>

    <div class="flex flex-col gap-2">
      <button data-zoom="in"  class="grid h-11 w-11 place-items-center rounded-xl border-2 border-slate-200 bg-white text-xl font-bold text-slate-600 shadow-sm transition hover:border-slate-300 active:scale-95">+</button>
      <button data-zoom="out" class="grid h-11 w-11 place-items-center rounded-xl border-2 border-slate-200 bg-white text-xl font-bold text-slate-600 shadow-sm transition hover:border-slate-300 active:scale-95">−</button>
      <a href="admin.html" title="관리자 페이지"
         class="grid h-11 w-11 place-items-center rounded-xl border-2 border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 active:scale-95">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- ===================== 진행 상황 · 공지사항 ===================== -->
  <div class="absolute inset-x-0 bottom-0 z-30 flex justify-center p-6">
    <div class="flex flex-col items-center gap-3">
      <div class="flex items-center gap-3 rounded-full border-2 border-slate-200 bg-white/90 px-5 py-2.5 shadow-lg backdrop-blur">
        <span id="progressDots" class="flex items-center gap-1.5"></span>
        <span id="progressText" class="text-base font-bold text-slate-500"></span>
      </div>

      <button id="btnNotice"
        class="hidden items-center gap-3 rounded-full bg-slate-900 px-8 py-4 text-xl font-extrabold text-white shadow-2xl transition hover:bg-slate-700 active:scale-95">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        </svg>
        공지사항 보기
      </button>
    </div>
  </div>

  <!-- 키 안내 -->
  <div class="pointer-events-none absolute bottom-7 left-6 z-30 text-sm font-medium text-slate-400">
    <kbd>←</kbd> <kbd>→</kbd> 테마 이동 &nbsp;·&nbsp; <kbd>Enter</kbd> 글 열기 &nbsp;·&nbsp; <kbd>ESC</kbd> 뒤로 &nbsp;·&nbsp; <kbd>F</kbd> 전체화면
  </div>
</div>

<!-- ===================== 레이어 팝업 ===================== -->
<div id="modal" class="fixed inset-0 z-50 hidden">
  <div id="modalBackdrop" class="absolute inset-0 bg-slate-900/45 backdrop-blur-md"></div>

  <div class="relative flex h-full items-center justify-center p-4 sm:p-8">
    <div id="modalPanel"
      class="modal-in flex max-h-[90vh] w-full max-w-3xl flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl">

      <!-- 상단 액센트 바 -->
      <div id="modalBar" class="h-2.5 w-full shrink-0 bg-slate-300"></div>

      <!-- 제목 -->
      <div class="relative shrink-0 px-7 pt-7 sm:px-10">
        <button id="modalClose"
          class="absolute right-6 top-6 grid h-11 w-11 place-items-center rounded-full border-2 border-slate-200 bg-white text-slate-600 transition hover:bg-slate-100 active:scale-95">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <div class="flex items-center gap-2.5">
          <span id="modalDot" class="h-3 w-3 rounded-full bg-slate-300"></span>
          <span id="modalTheme" class="text-sm font-bold tracking-wide text-slate-500"></span>
        </div>
        <h2 id="modalTitle" class="mt-2 pr-16 text-3xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-4xl"></h2>
        <p id="modalSubtitle" class="mt-4 text-xl font-semibold leading-relaxed text-slate-700 sm:text-2xl"></p>
      </div>

      <!-- 본문 -->
      <div class="mt-5 min-h-0 flex-1 overflow-y-auto px-7 pb-6 sm:px-10">
        <div id="modalBody" class="space-y-5 text-lg leading-8 text-slate-600"></div>
      </div>

      <!-- 푸터 -->
      <div class="flex shrink-0 items-center justify-end gap-4 border-t border-slate-100 bg-slate-50 px-7 py-4 sm:px-10">
        <div class="flex shrink-0 items-center gap-2">
          <button id="modalPrev" class="grid h-11 w-11 place-items-center rounded-xl border-2 border-slate-200 bg-white text-slate-600 transition hover:border-slate-300 active:scale-95" title="이전 테마 (←)">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="modalNext" class="grid h-11 w-11 place-items-center rounded-xl border-2 border-slate-200 bg-white text-slate-600 transition hover:border-slate-300 active:scale-95" title="다음 테마 (→)">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button id="modalCloseBtn"
            class="rounded-xl bg-slate-900 px-6 py-3 text-base font-bold text-white transition hover:bg-slate-700 active:scale-95">닫기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 공지사항 팝업 ===================== -->
<div id="notice" class="fixed inset-0 z-[60] hidden">
  <div id="noticeBackdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-md"></div>

  <div class="relative flex h-full items-center justify-center p-6">
    <div id="noticePanel" class="modal-in flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl">
      <div class="h-3 w-full shrink-0 bg-gradient-to-r from-emerald-500 via-cyan-500 to-amber-500"></div>

      <!-- 공지 내용 (JS가 한 장씩 그려 넣습니다) -->
      <div class="min-h-0 flex-1 overflow-y-auto px-8 py-10 text-center sm:px-14 sm:py-12">
        <div id="noticeIcon" class="mx-auto grid h-16 w-16 place-items-center rounded-full"></div>
        <p id="noticeKicker" class="mt-6 text-sm font-extrabold tracking-[0.3em] text-slate-400"></p>
        <div id="noticeBody" class="mt-5"></div>
      </div>

      <!-- 페이지 표시 + 이동 -->
      <div class="flex shrink-0 items-center justify-between gap-4 border-t border-slate-100 bg-slate-50 px-7 py-4 sm:px-10">
        <div id="noticeDots" class="flex items-center gap-2"></div>

        <div class="flex items-center gap-2">
          <button id="noticePrev"
            class="rounded-xl border-2 border-slate-200 bg-white px-5 py-3 text-base font-bold text-slate-600 transition hover:border-slate-300 active:scale-95">
            이전
          </button>
          <button id="noticeNext"
            class="flex items-center gap-2 rounded-xl bg-slate-900 px-7 py-3 text-base font-bold text-white transition hover:bg-slate-700 active:scale-95">
            <span id="noticeNextText">다음</span>
            <svg id="noticeNextIcon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   1) 데이터  ―  내용 수정은 관리자 페이지(admin.html)에서 합니다.
      · 여기서는 저장소(store.js)가 준 데이터를 받아 쓰기만 합니다.
      · 우선순위 : localStorage(관리자 저장) > save.js(배포본) > data.js(기본값)
   ========================================================================= */
const DATA = PM.load();

const WORLD   = DATA.world;    // 3열 그리드로 자동 계산된 좌표계 크기
const CHIP    = DATA.chip;     // 키워드 칩 거리
const THEMES  = DATA.themes;   // 미디어 + 글 (위치는 그리드가 정합니다)
const NOTICES = DATA.notices;  // 모든 글을 읽은 뒤 나오는 공지


/* =========================================================================
   2) 뷰포트(줌/팬) 엔진
   ========================================================================= */
const stage   = document.getElementById('stage');
const world   = document.getElementById('world');
const crumb   = document.getElementById('breadcrumb');
const btnBack = document.getElementById('btnBack');
const slideNav = document.getElementById('slideNav');

const ZOOM_MIN = 0.35, ZOOM_MAX = 4;
const FOCUS_SCALE = 2.0;          // 이미지 클릭 시 확대 배율
const KEYWORD_SHOW_SCALE = 1.4;   // 이 배율 이상이어야 키워드가 보임

let view = { k: 1, x: 0, y: 0 };
let activeTheme = null;   // 현재 확대된 테마 id
let openThemeId = null;   // 팝업으로 열려 있는 글의 테마 id

const nodes = { themes: new Map(), keywords: new Map(), labels: new Map(), checks: new Map() };
const visited = new Set();   // 글을 한 번이라도 연 테마 id
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const themeById = id => THEMES.find(t => t.id === id);

function applyView(animate = true) {
  world.classList.toggle('animate', animate);
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  render();
}

/** 특정 월드 좌표를 화면 중앙으로 */
function centerOn(wx, wy, k, animate = true) {
  view.k = clamp(k, ZOOM_MIN, ZOOM_MAX);
  view.x = stage.clientWidth  / 2 - wx * view.k;
  view.y = stage.clientHeight / 2 - wy * view.k;
  applyView(animate);
}

/** 전체가 보이도록 맞추기 */
function fitAll(animate = true) {
  const k = Math.min(stage.clientWidth / WORLD.w, stage.clientHeight / WORLD.h) * 0.9;
  activeTheme = null;
  centerOn(WORLD.w / 2, WORLD.h / 2, k, animate);
  updateChrome();
}

/* =========================================================================
   3) 마커 생성
   ========================================================================= */
function buildMarkers() {
  world.innerHTML = '';

  THEMES.forEach(theme => {
    /* ---- 대표 이미지 마커 : 처음 화면에는 이것만 보입니다 ---- */
    const t = document.createElement('button');
    t.className = 'marker fade group z-20 focus:outline-none';
    t.style.left = theme.x + 'px';
    t.style.top  = theme.y + 'px';
    t.innerHTML = `
      <div class="flex flex-col items-center">
        <div class="relative">
          <span class="absolute inset-0 -m-4 rounded-full bg-slate-900/5 opacity-0 transition group-hover:opacity-100"></span>
          <div class="relative h-52 w-52 overflow-hidden rounded-full bg-slate-900 shadow-2xl ring-[6px] ring-white
                      transition duration-300 group-hover:scale-105">
            ${theme.media
              ? `<img class="h-full w-full object-cover" alt="${theme.name}" src="${theme.media}">`
              : `<div class="grid h-full w-full place-items-center bg-slate-200 text-sm font-extrabold text-slate-400">이미지 없음</div>`}
          </div>
          <span class="pointer-events-none absolute inset-0 rounded-full ring-2 ring-slate-900/10"></span>
          <span class="theme-check fade hidden-soft pointer-events-none absolute -right-2 -top-2 grid h-14 w-14
                       place-items-center rounded-full ${theme.c.nav} text-white shadow-xl ring-4 ring-white">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
        </div>
        <span class="theme-label fade hidden-soft mt-5 rounded-full border-2 border-slate-200 bg-white px-6 py-2.5
                     text-2xl font-extrabold tracking-tight text-slate-900 shadow-lg">${theme.name}</span>
      </div>`;
    t.addEventListener('click', e => { e.stopPropagation(); focusTheme(theme); });
    world.appendChild(t);
    nodes.themes.set(theme.id, t);
    nodes.labels.set(theme.id, t.querySelector('.theme-label'));
    nodes.checks.set(theme.id, t.querySelector('.theme-check'));

    /* ---- 키워드 칩 (테마당 1개) : 확대해야 나타납니다 ---- */
    nodes.keywords.set(theme.id, []);

    /* 왼쪽에 있는 이미지는 오른쪽에, 오른쪽에 있는 이미지는 왼쪽에 칩을 붙입니다 */
    const side  = theme.side || (theme.x < WORLD.w / 2 ? 'right' : 'left');
    const angle = side === 'right' ? 0 : 180;
    const dist  = CHIP.dist;
    const rad   = angle * Math.PI / 180;

    /* 이미지 ↔ 키워드 연결선 */
    const line = document.createElement('div');
    line.className = 'marker fade hidden-soft z-10 pointer-events-none';
    line.style.left = theme.x + 'px';
    line.style.top  = theme.y + 'px';
    line.style.transformOrigin = 'left center';
    line.dataset.isLine = '1';
    line.dataset.angle  = angle;
    line.innerHTML = `<div class="h-0.5 rounded bg-gradient-to-r from-slate-400/0 via-slate-400/60 to-slate-400/60" style="width:${dist}px"></div>`;
    world.appendChild(line);
    nodes.keywords.get(theme.id).push(line);

    /* 키워드 칩 */
    const k = document.createElement('button');
    k.className = 'marker fade hidden-soft z-30 focus:outline-none';
    k.style.left = (theme.x + Math.cos(rad) * dist) + 'px';
    k.style.top  = (theme.y + Math.sin(rad) * dist) + 'px';
    /* 칩이 이미지의 어느 쪽에 붙느냐에 따라 화살표 방향과 순서를 바꿉니다 */
    const dotEl   = `<span class="h-3.5 w-3.5 shrink-0 rounded-full ${theme.c.dot}"></span>`;
    const titleEl = `<span class="whitespace-nowrap text-2xl font-extrabold tracking-tight text-slate-900">${theme.article.title}</span>`;
    const arrowEl = dir => `<svg class="h-5 w-5 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="${dir === 'right' ? 'm9 18 6-6-6-6' : 'm15 18-6-6 6-6'}"/></svg>`;

    k.innerHTML = `
      <div class="flex items-center gap-3 rounded-full border-2 border-slate-200 bg-white py-3.5 px-5
                  shadow-xl transition duration-200 hover:-translate-y-0.5 hover:shadow-2xl ${theme.c.border}">
        ${side === 'right' ? dotEl + titleEl + arrowEl('right') : arrowEl('left') + titleEl + dotEl}
      </div>`;
    k.addEventListener('click', e => { e.stopPropagation(); openModal(theme.id); });
    world.appendChild(k);
    nodes.keywords.get(theme.id).push(k);
  });

  /* ---- 하단 슬라이드 내비게이션 ---- */
  slideNav.innerHTML = '';
  const home = document.createElement('button');
  home.className = 'rounded-full px-4 py-2 text-base font-bold text-slate-500 transition hover:bg-slate-100';
  home.textContent = '전체';
  home.addEventListener('click', () => fitAll());
  slideNav.appendChild(home);

  THEMES.forEach(theme => {
    const b = document.createElement('button');
    b.dataset.navFor = theme.id;
    b.className = 'rounded-full px-4 py-2 text-base font-bold text-slate-500 transition hover:bg-slate-100';
    b.textContent = theme.name;
    b.addEventListener('click', () => focusTheme(theme));
    slideNav.appendChild(b);
  });
}

/** 줌 배율이 변해도 마커는 화면상 크기가 일정 (구글맵 핀과 같은 방식) */
function render() {
  const inv = 1 / view.k;
  world.querySelectorAll('.marker').forEach(el => {
    el.style.transform = el.dataset.isLine
      ? `scale(${inv}) rotate(${el.dataset.angle}deg)`
      : `translate(-50%, -50%) scale(${inv})`;
  });
}

/* =========================================================================
   4) 상태 전환
   ========================================================================= */
function focusTheme(theme) {
  activeTheme = theme.id;
  centerOn(theme.x, theme.y, FOCUS_SCALE);
  updateChrome();
}

function updateChrome() {
  const zoomedEnough = view.k >= KEYWORD_SHOW_SCALE;

  THEMES.forEach(theme => {
    const isActive = theme.id === activeTheme;
    nodes.themes.get(theme.id).classList.toggle('dim', !!activeTheme && !isActive);
    nodes.labels.get(theme.id).classList.toggle('hidden-soft', !isActive);

    const show = isActive && zoomedEnough;
    (nodes.keywords.get(theme.id) || []).forEach((el, idx) => {
      el.classList.toggle('hidden-soft', !show);
      el.style.transitionDelay = show ? (idx * 35) + 'ms' : '0ms';
    });

    const nav = slideNav.querySelector(`[data-nav-for="${theme.id}"]`);
    if (nav) {
      nav.className = isActive
        ? `rounded-full px-4 py-2 text-base font-bold text-white shadow transition ${theme.c.nav}`
        : 'rounded-full px-4 py-2 text-base font-bold text-slate-500 transition hover:bg-slate-100';
    }
  });

  const theme = themeById(activeTheme);
  if (theme) {
    crumb.innerHTML = `<span class="text-slate-400">테마</span>
      <span class="mx-2 text-slate-300">/</span>
      <span class="font-bold text-slate-800">${theme.name}</span>
      <span class="ml-2 text-slate-400">· ${theme.article.title}</span>`;
    btnBack.classList.remove('hidden'); btnBack.classList.add('flex');
  } else {
    crumb.textContent = '이미지를 클릭하면 확대되면서 키워드가 나타납니다';
    btnBack.classList.add('hidden'); btnBack.classList.remove('flex');
  }
}

/* =========================================================================
   5) 레이어 팝업
   ========================================================================= */
const modal = document.getElementById('modal');

function openModal(themeId) {
  const theme = themeById(themeId);
  if (!theme || !theme.article) return;
  const kw = theme.article;

  openThemeId = themeId;

  document.getElementById('modalBar').className = 'h-2.5 w-full shrink-0 ' + theme.c.nav;
  document.getElementById('modalDot').className = 'h-3 w-3 rounded-full ' + theme.c.dot;
  document.getElementById('modalTheme').textContent = theme.name;
  document.getElementById('modalTitle').textContent    = kw.title;
  document.getElementById('modalSubtitle').textContent = kw.subtitle || '';
  document.getElementById('modalBody').innerHTML =
    (kw.body || []).map(p => `<p>${p}</p>`).join('');

  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  const panel = document.getElementById('modalPanel');
  panel.classList.remove('modal-in'); void panel.offsetWidth; panel.classList.add('modal-in');

  markVisited(themeId);
}

/** 팝업을 연 채로 앞/뒤 테마의 글로 이동 (발표용 슬라이드 넘김) */
function stepModal(dir) {
  const i = THEMES.findIndex(t => t.id === openThemeId);
  if (i === -1) return;
  const next = THEMES[(i + dir + THEMES.length) % THEMES.length];
  focusTheme(next);
  openModal(next.id);
}

function closeModal() {
  modal.classList.add('hidden');
  document.body.style.overflow = '';
  openThemeId = null;
}

/* =========================================================================
   5-1) 진행 상황 · 공지사항
        4개 테마의 글을 모두 한 번씩 열어 본 뒤에 공지사항 버튼이 나타납니다.
   ========================================================================= */
const notice        = document.getElementById('notice');
const btnNotice     = document.getElementById('btnNotice');
const progressDots  = document.getElementById('progressDots');
const progressText  = document.getElementById('progressText');

function markVisited(themeId) {
  if (visited.has(themeId)) return;
  visited.add(themeId);
  updateProgress();
}

function updateProgress() {
  const done = visited.size === THEMES.length;

  progressDots.innerHTML = THEMES.map(t =>
    `<span class="h-3 w-3 rounded-full transition ${visited.has(t.id) ? t.c.nav : 'bg-slate-200'}"></span>`
  ).join('');
  progressText.textContent = done
    ? '모든 테마를 읽었습니다'
    : `${visited.size} / ${THEMES.length} 읽음`;

  THEMES.forEach(t =>
    nodes.checks.get(t.id)?.classList.toggle('hidden-soft', !visited.has(t.id)));

  btnNotice.classList.toggle('hidden', !done);
  btnNotice.classList.toggle('flex',    done);
  if (done && !btnNotice.dataset.shown) {
    btnNotice.dataset.shown = '1';
    btnNotice.classList.add('notice-pop');
  }
}

/* ---- 공지 한 장 그리기 ---- */
const noticeIcon     = document.getElementById('noticeIcon');
const noticeKicker   = document.getElementById('noticeKicker');
const noticeBodyEl   = document.getElementById('noticeBody');
const noticeDots     = document.getElementById('noticeDots');
const noticePrev     = document.getElementById('noticePrev');
const noticeNext     = document.getElementById('noticeNext');
const noticeNextText = document.getElementById('noticeNextText');
const noticeNextIcon = document.getElementById('noticeNextIcon');

let noticeIndex = 0;

function renderNotice() {
  const n    = NOTICES[noticeIndex];
  const last = noticeIndex === NOTICES.length - 1;

  noticeIcon.className = `mx-auto grid h-16 w-16 place-items-center rounded-full ${n.icon.bg} ${n.icon.fg}`;
  noticeIcon.innerHTML = `<svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${n.icon.path}</svg>`;
  noticeKicker.textContent = n.kicker;

  const heading = `<p class="text-2xl font-extrabold leading-relaxed tracking-tight text-slate-900 sm:text-3xl">${n.title}</p>`;
  const desc    = n.desc ? `<p class="mt-3 text-lg font-bold leading-relaxed text-slate-600">${n.desc}</p>` : '';
  const chips   = n.chips
    ? `<div class="mt-7 flex flex-wrap items-center justify-center gap-2">${
        THEMES.map(t => `<span class="flex items-center gap-1.5 rounded-full bg-slate-50 px-3 py-1.5 text-sm font-bold text-slate-600 ring-1 ring-slate-200">
             <span class="h-2 w-2 rounded-full ${t.c.nav}"></span>${t.article.title}
           </span>`).join('')
      }</div>`
    : '';

  noticeBodyEl.innerHTML = n.box
    ? `<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 px-6 py-7">
         <div class="flex items-center justify-center gap-2 text-amber-700">
           <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
             <rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
           </svg>
           <span class="text-sm font-extrabold tracking-[0.25em]">${n.badge || ''}</span>
         </div>
         <div class="mt-3">${heading}</div>${desc}
       </div>${chips}`
    : `${heading}${desc}${chips}`;

  noticeDots.innerHTML = NOTICES.map((_, i) =>
    `<span class="h-2.5 rounded-full transition-all ${i === noticeIndex ? 'w-7 bg-slate-900' : 'w-2.5 bg-slate-300'}"></span>`
  ).join('');

  noticePrev.classList.toggle('invisible', noticeIndex === 0);
  noticeNextText.textContent = last ? '확인' : '다음';
  noticeNextIcon.classList.toggle('hidden', last);
}

/** 다음/이전 공지로 이동 (마지막 장에서 '다음'을 누르면 닫힙니다) */
function stepNotice(dir) {
  const next = noticeIndex + dir;
  if (next >= NOTICES.length) { closeNotice(); return; }
  if (next < 0) return;
  noticeIndex = next;
  renderNotice();
  noticeBodyEl.classList.remove('modal-in');
  void noticeBodyEl.offsetWidth;
  noticeBodyEl.classList.add('modal-in');
}

function openNotice() {
  if (visited.size < THEMES.length) return;
  closeModal();
  noticeIndex = 0;
  renderNotice();
  notice.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  const panel = document.getElementById('noticePanel');
  panel.classList.remove('modal-in'); void panel.offsetWidth; panel.classList.add('modal-in');
  btnNotice.classList.remove('notice-pop');   // 파장 애니메이션 정지
}

function closeNotice() {
  notice.classList.add('hidden');
  document.body.style.overflow = '';
}

btnNotice.addEventListener('click', openNotice);
noticeNext.addEventListener('click', () => stepNotice(1));
noticePrev.addEventListener('click', () => stepNotice(-1));
document.getElementById('noticeBackdrop').addEventListener('click', closeNotice);

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', closeModal);
document.getElementById('modalPrev').addEventListener('click', () => stepModal(-1));
document.getElementById('modalNext').addEventListener('click', () => stepModal(1));

/* =========================================================================
   6) 인터랙션 (드래그 팬 / 휠 줌 / 발표용 키보드)
   ========================================================================= */
let drag = null;

/* 버튼·링크 위에서는 지도 드래그를 시작하지 않습니다.
   (여기서 걸러 내지 않으면 setPointerCapture 가 pointerup 을 가로채서
    링크의 클릭 자체가 브라우저에 전달되지 않습니다) */
const isControl = el => !!el.closest('button, a, [data-zoom]');

stage.addEventListener('pointerdown', e => {
  if (isControl(e.target)) return;
  drag = { sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y, moved: false };
  stage.setPointerCapture(e.pointerId);
  stage.classList.replace('cursor-grab', 'cursor-grabbing');
});

stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  view.x = drag.ox + dx;
  view.y = drag.oy + dy;
  applyView(false);
});

stage.addEventListener('pointerup', e => {
  const moved = drag?.moved;
  drag = null;
  stage.classList.replace('cursor-grabbing', 'cursor-grab');
  if (!moved && activeTheme && !isControl(e.target)) fitAll();
});

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const k = clamp(view.k * Math.exp(-e.deltaY * 0.0016), ZOOM_MIN, ZOOM_MAX);
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  if (activeTheme && k < KEYWORD_SHOW_SCALE - 0.2) activeTheme = null;
  applyView(false);
  updateChrome();
}, { passive: false });

document.querySelectorAll('[data-zoom]').forEach(btn => {
  btn.addEventListener('click', () => {
    const k  = clamp(view.k * (btn.dataset.zoom === 'in' ? 1.4 : 1 / 1.4), ZOOM_MIN, ZOOM_MAX);
    const cx = (stage.clientWidth  / 2 - view.x) / view.k;
    const cy = (stage.clientHeight / 2 - view.y) / view.k;
    if (activeTheme && k < KEYWORD_SHOW_SCALE - 0.2) activeTheme = null;
    centerOn(cx, cy, k);
    updateChrome();
  });
});

btnBack.addEventListener('click', () => fitAll());

/* ---- 전체화면 전용 버튼 ---- */
const btnFull     = document.getElementById('btnFull');
const btnFullText = document.getElementById('btnFullText');
const btnFullIcon = document.getElementById('btnFullIcon');

const ICON_ENTER = '<path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>';
const ICON_EXIT  = '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M16 21v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';

btnFull.addEventListener('click', toggleFullscreen);

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  btnFullText.textContent = on ? '전체화면 종료' : '전체화면';
  btnFullIcon.innerHTML   = on ? ICON_EXIT : ICON_ENTER;
  btnFull.title = on ? '전체화면 종료 (F)' : '전체화면 (F)';
});

/** 테마 사이 이동 (발표용 슬라이드 넘김) */
function stepTheme(dir) {
  const i = THEMES.findIndex(t => t.id === activeTheme);
  if (i === -1) { focusTheme(THEMES[dir > 0 ? 0 : THEMES.length - 1]); return; }
  const next = i + dir;
  if (next < 0 || next >= THEMES.length) { fitAll(); return; }
  focusTheme(THEMES[next]);
}

document.addEventListener('keydown', e => {
  const noticeOpen = !notice.classList.contains('hidden');
  const modalOpen  = !modal.classList.contains('hidden');

  if (e.key === 'Escape') {
    if (noticeOpen) closeNotice();
    else if (modalOpen) closeModal();
    else if (activeTheme) fitAll();
    return;
  }
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }

  /* 공지 팝업이 열려 있는 동안에는 공지 넘기기만 동작합니다 */
  if (noticeOpen) {
    if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault(); stepNotice(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault(); stepNotice(-1);
    }
    return;
  }
  /* N : 모든 테마를 읽었으면 공지사항 열기 */
  if (e.key === 'n' || e.key === 'N') { openNotice(); return; }

  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    modalOpen ? stepModal(1) : stepTheme(1);
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    modalOpen ? stepModal(-1) : stepTheme(-1);
    return;
  }
  if (e.key === 'Home') { closeModal(); fitAll(); return; }

  /* Enter / ↓ : 현재 테마의 글 열기 */
  if ((e.key === 'Enter' || e.key === 'ArrowDown') && activeTheme && !modalOpen) {
    e.preventDefault();
    openModal(activeTheme);
    return;
  }
  /* 1~4 : 해당 테마로 바로 이동해서 글 열기 */
  if (/^[1-4]$/.test(e.key)) {
    const theme = THEMES[Number(e.key) - 1];
    if (theme) { focusTheme(theme); openModal(theme.id); }
  }
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const theme = themeById(activeTheme);
    if (theme) centerOn(theme.x, theme.y, view.k, false);
    else fitAll(false);
  }, 120);
});

/* ===== 시작 ===== */
buildMarkers();
fitAll(false);
updateProgress();
</script>
</body>
